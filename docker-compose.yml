      - Jwt__Key=OrgSvc-Docker-Secret-Key-tim8-uris-2026-secure!!
      - Jwt__Issuer=OrganizationService
      - Jwt__Audience=OrganizationService
      # Cloudflare Turnstile test secret (always passes) — replace with the real secret in production
