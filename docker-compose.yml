services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=tim8urisPassword!
    volumes:
      - sql-data:/var/opt/mssql
    ports:
      - "1433:1433"
    restart: always

  gateway:
    image: nginx:stable-alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - anonymous-user-service
      - organization-service
      - problem-service
      - problem-box-service
      - subscription-service
      - suggestion-service
      - suggestion-box-service
      - billing-notification-service
      - system-notification-service
      - attachment-service
      - logger-service
      - mcp-gateway
      - ai-assistant-service
    restart: always

  anonymous-user-service:
    build: ./AnonymousUserService
    container_name: anonymous-user-service
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AnonymousUserDB=Server=sql-server;Database=AnonymousUserDB;User Id=sa;Password=tim8urisPassword!;TrustServerCertificate=True
      - Services__LoggerServiceBaseUrl=http://logger-service:8080
      - Jwt__Key=AnonSvc-Docker-Secret-Key-tim8-uris-2026-secure!!
      - Jwt__Issuer=AnonymousUserService
      - Jwt__Audience=AnonymousUserService
      # Cloudflare Turnstile test secret (always passes) — replace with the real secret in production
      - Captcha__SecretKey=1x0000000000000000000000000000000AA
    depends_on:
      - sql-server
    restart: always

