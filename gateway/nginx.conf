worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    upstream anonymous_service {
        server anonymous-user-service:8080;
    }

    upstream organization_service {
        server organization-service:8080;
    }

    upstream problem_service {
        server problem-service:8080;
    }

    upstream problem_box_service {
        server problem-box-service:8080;
    }

    upstream subscription_service {
        server subscription-service:8080;
    }

    upstream suggestion_service {
        server suggestion-service:8080;
    }

    upstream suggestion_box_service {
        server suggestion-box-service:8080;
    }

    upstream billing_notification_service {
        server billing-notification-service:8080;
    }

    upstream system_notification_service {
        server system-notification-service:8080;
    }

    upstream attachment_service {
        server attachment-service:8080;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ─── Anonymous User Service ───────────────────────────
        location /api/AnonymousUser/ {
            proxy_pass http://anonymous_service/api/AnonymousUser/;
        }
        location /api/BoxAccessLink/ {
            proxy_pass http://anonymous_service/api/BoxAccessLink/;
        }

        # ─── Organization Service ─────────────────────────────
        location /api/Organization/ {
            proxy_pass http://organization_service/api/Organization/;
        }
        location /api/User/ {
            proxy_pass http://organization_service/api/User/;
        }
        location /api/UserRole/ {
            proxy_pass http://organization_service/api/UserRole/;
        }

        # ─── Problem Service ──────────────────────────────────
        location /api/Problem/ {
            proxy_pass http://problem_service/api/Problem/;
        }
        location /api/ProblemCategory/ {
            proxy_pass http://problem_service/api/ProblemCategory/;
        }
        location /api/ProblemComment/ {
            proxy_pass http://problem_service/api/ProblemComment/;
        }

        # ─── Problem Box Service ──────────────────────────────
        location /api/ProblemBox/ {
            proxy_pass http://problem_box_service/api/ProblemBox/;
        }

        # ─── Subscription Service ─────────────────────────────
        location /api/Subscription/ {
            proxy_pass http://subscription_service/api/Subscription/;
        }
        location /api/SubscriptionPlan/ {
            proxy_pass http://subscription_service/api/SubscriptionPlan/;
        }
        location /api/Payment/ {
            proxy_pass http://subscription_service/api/Payment/;
        }

        # ─── Suggestion Service ───────────────────────────────
        location /api/Suggestion/ {
            proxy_pass http://suggestion_service/api/Suggestion/;
        }
        location /api/SuggestionCategory/ {
            proxy_pass http://suggestion_service/api/SuggestionCategory/;
        }
        location /api/SuggestionComment/ {
            proxy_pass http://suggestion_service/api/SuggestionComment/;
        }
        location /api/Vote/ {
            proxy_pass http://suggestion_service/api/Vote/;
        }

        # ─── Suggestion Box Service ───────────────────────────
        location /api/SuggestionBox/ {
            proxy_pass http://suggestion_box_service/api/SuggestionBox/;
        }

        # ─── Billing Notification Service ─────────────────────
        location /api/BillingNotification/ {
            proxy_pass http://billing_notification_service/api/BillingNotification/;
        }

        # ─── System Notification Service ──────────────────────
        location /api/SystemNotification/ {
            proxy_pass http://system_notification_service/api/SystemNotification/;
        }

        # ─── Attachment Service ───────────────────────────────
        location /api/Attachment/ {
            proxy_pass http://attachment_service/api/Attachment/;
        }

        # ─── Health Check ─────────────────────────────────────
        location /health {
            return 200 'API Gateway OK';
            add_header Content-Type text/plain;
        }
    }
}